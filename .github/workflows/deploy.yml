name: Deploy → Cloudflare Pages

on:
  push:
    branches: [main]      # production deploy: hanya dari main
  workflow_dispatch:       # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to nugget-nihongo.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build & Validate
        run: npm run build

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🚀 Deploying to Cloudflare Pages..."
            wrangler pages deploy dist --project-name=nugget-nihongo --branch=main
          else
            echo "⚠️ CLOUDFLARE_API_TOKEN is not configured in repository secrets. Skipping Cloudflare Pages deployment."
          fi

      - name: Confirm live URL
        run: echo "✅ Live at https://nugget-nihongo.pages.dev"
