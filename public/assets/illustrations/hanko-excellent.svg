<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Stempel Hanko Taihen Yoku Dekimashita">
  <defs>
    <filter id="hankoStamp" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Hanko Authentic Vermilion Red Double Flower (たいへんよくできました) -->
  <g filter="url(#hankoStamp)" stroke="#dc2626" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Cherry Blossom 10-Petal Crest -->
    <path d="M100 20 C112 10 126 22 134 32 C148 28 160 42 164 56 C178 58 184 74 182 88 C192 98 190 114 182 126 C186 140 176 154 164 160 C160 174 144 182 130 180 C120 192 104 190 94 182 C80 188 66 178 60 166 C46 166 38 150 40 136 C30 126 32 110 38 98 C34 84 44 70 56 64 C60 50 76 42 90 44 C96 32 100 24 100 20 Z" />
    
    <!-- Inner Concentric Circle -->
    <circle cx="100" cy="100" r="54" stroke-width="3" stroke-dasharray="120 6" />

    <!-- Center Hanamaru Star Spiral -->
    <path d="M100 70 L103 78 L111 79 L105 84 L107 92 L100 87 L93 92 L95 84 L89 79 L97 78 Z" fill="#dc2626" stroke="none"/>

    <!-- Traditional Calligraphic Text (たいへんよくできました) in Vermilion -->
    <text x="100" y="112" fill="#dc2626" stroke="none" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="15" text-anchor="middle">たいへん</text>
    <text x="100" y="132" fill="#dc2626" stroke="none" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="14" text-anchor="middle">よくできました</text>
    <text x="100" y="148" fill="#dc2626" stroke="none" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="10" text-anchor="middle">💮 合格 💮</text>
  </g>
</svg>