<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Boneka Daruma Ketabahan Nanakorobi Yaoki">
  <defs>
    <radialGradient id="darumaRed" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="darumaFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="darumaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="100" cy="100" r="92" fill="#fff1f2" opacity="0.6"/>

  <!-- Daruma Doll Body Group -->
  <g filter="url(#darumaShadow)">
    <!-- Red Spherical Body -->
    <ellipse cx="100" cy="115" rx="72" ry="68" fill="url(#darumaRed)"/>
    <ellipse cx="100" cy="75" rx="58" ry="52" fill="url(#darumaRed)"/>

    <!-- Gold Cloud Embellishments on Sides -->
    <path d="M42 118 C36 108 44 98 52 104 C56 100 64 104 62 112 C60 120 48 126 42 118 Z" fill="#f59e0b" opacity="0.85"/>
    <path d="M158 118 C164 108 156 98 148 104 C144 100 136 104 138 112 C140 120 152 126 158 118 Z" fill="#f59e0b" opacity="0.85"/>

    <!-- Cream Face Area (Heart/Peach shaped opening) -->
    <path d="M100 48 C76 48 64 62 64 80 C64 96 78 108 100 108 C122 108 136 96 136 80 C136 62 124 48 100 48 Z" fill="url(#darumaFace)"/>

    <!-- Crane Eyebrows (Symbolizing longevity & perseverance) -->
    <path d="M74 68 C80 62 90 64 94 70 C88 72 82 72 74 68 Z" fill="#1c1917"/>
    <path d="M126 68 C120 62 110 64 106 70 C112 72 118 72 126 68 Z" fill="#1c1917"/>

    <!-- Big Wide Eyes (Determined look) -->
    <circle cx="83" cy="80" r="8" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
    <circle cx="83" cy="80" r="4.5" fill="#1c1917"/>
    <circle cx="85" cy="78" r="1.5" fill="#ffffff"/>

    <circle cx="117" cy="80" r="8" fill="#ffffff" stroke="#1c1917" stroke-width="2"/>
    <circle cx="117" cy="80" r="4.5" fill="#1c1917"/>
    <circle cx="119" cy="78" r="1.5" fill="#ffffff"/>

    <!-- Turtle Mustache / Beard -->
    <path d="M86 94 C92 90 98 92 100 95 C102 92 108 90 114 94 C108 98 92 98 86 94 Z" fill="#1c1917"/>

    <!-- Golden Chest Kanji: 必勝 (Certain Victory / Ganbaru) -->
    <rect x="80" y="126" width="40" height="42" rx="6" fill="#fef08a" opacity="0.9"/>
    <text x="100" y="146" fill="#b45309" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="16" text-anchor="middle">必</text>
    <text x="100" y="162" fill="#b45309" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="16" text-anchor="middle">勝</text>
  </g>
</svg>