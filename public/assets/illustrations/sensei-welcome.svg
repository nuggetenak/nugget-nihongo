<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Sensei Menyambut Hangat">
  <defs>
    <linearGradient id="bgGlowW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="skinW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="kimonoW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="softShadowW" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="120" cy="120" r="108" fill="url(#bgGlowW)"/>

  <!-- Cherry Blossom Petals Floating -->
  <path d="M42 64 C38 58 44 48 52 52 C56 56 50 66 42 64 Z" fill="#fda4af" opacity="0.75"/>
  <path d="M202 78 C198 72 204 62 212 66 C216 70 210 80 202 78 Z" fill="#fda4af" opacity="0.6"/>
  <path d="M192 168 C188 162 194 154 200 156 C204 160 198 170 192 168 Z" fill="#fda4af" opacity="0.5"/>

  <!-- Character Group -->
  <g filter="url(#softShadowW)">
    <!-- Body / Blue Blazer -->
    <path d="M72 178 C72 148 94 138 120 138 C146 138 168 148 168 178 L174 234 L66 234 Z" fill="url(#kimonoW)"/>
    <!-- White Collared Shirt -->
    <path d="M106 138 L120 170 L134 138 Z" fill="#ffffff"/>
    <path d="M117 146 L123 146 L125 174 L120 180 L115 174 Z" fill="#f59e0b"/>

    <!-- Waving Right Hand (Left in view) -->
    <!-- Arm -->
    <path d="M68 160 C54 146 44 122 52 108 C58 98 70 106 72 118 L82 148 Z" fill="url(#kimonoW)"/>
    <!-- Hand waving palm -->
    <ellipse cx="52" cy="104" rx="10" ry="11" fill="url(#skinW)" transform="rotate(-15 52 104)"/>
    <!-- Four fingers -->
    <path d="M44 98 Q46 92 50 93 Q52 98 48 102" stroke="#fed7aa" stroke-width="2.5" fill="none"/>
    <path d="M50 94 Q54 88 57 90 Q58 96 53 100" stroke="#fed7aa" stroke-width="2.5" fill="none"/>
    <path d="M56 97 Q60 92 63 94 Q64 100 58 103" stroke="#fed7aa" stroke-width="2.5" fill="none"/>

    <!-- Left Hand holding Book / Tablet "日本語" -->
    <rect x="146" y="152" width="36" height="46" rx="4" fill="#f59e0b" transform="rotate(-10 146 152)"/>
    <rect x="150" y="156" width="28" height="38" rx="2" fill="#fffbeb" transform="rotate(-10 150 156)"/>
    <text x="156" y="178" fill="#b45309" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="10" transform="rotate(-10 156 178)">日 本</text>
    <ellipse cx="148" cy="184" rx="8" ry="7" fill="url(#skinW)"/>

    <!-- Neck -->
    <rect x="111" y="120" width="18" height="22" rx="4" fill="url(#skinW)"/>

    <!-- Head -->
    <ellipse cx="120" cy="88" rx="34" ry="36" fill="url(#skinW)"/>

    <!-- Hair -->
    <path d="M86 82 C86 54 102 40 120 40 C138 40 154 54 154 82 C154 62 140 50 120 50 C100 50 88 64 86 82 Z" fill="#1c1917"/>
    <path d="M94 62 Q110 52 126 62 Q140 56 148 70 Q138 64 126 70 Q112 60 94 62 Z" fill="#1c1917"/>

    <!-- Eyebrows (Warm cheerful) -->
    <path d="M100 75 Q108 70 115 74" stroke="#292524" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M125 74 Q132 70 140 75" stroke="#292524" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (Joyful Japanese smile eyes) -->
    <path d="M100 85 Q108 92 115 85" stroke="#1c1917" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M125 85 Q132 92 140 85" stroke="#1c1917" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Glasses -->
    <rect x="96" y="78" width="20" height="15" rx="4" stroke="#d97706" stroke-width="2.5" fill="none" opacity="0.9"/>
    <rect x="124" y="78" width="20" height="15" rx="4" stroke="#d97706" stroke-width="2.5" fill="none" opacity="0.9"/>
    <line x1="116" y1="85" x2="124" y2="85" stroke="#d97706" stroke-width="2.5"/>

    <!-- Cheeks (Blushing pink) -->
    <ellipse cx="98" cy="95" rx="6" ry="4" fill="#f43f5e" opacity="0.45"/>
    <ellipse cx="142" cy="95" rx="6" ry="4" fill="#f43f5e" opacity="0.45"/>

    <!-- Nose -->
    <path d="M120 90 Q122 95 119 97" stroke="#ea580c" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Big Warm Smile -->
    <path d="M111 103 Q120 113 129 103" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" fill="#fff1f2"/>
  </g>

  <!-- Waving Motion lines -->
  <path d="M34 94 Q38 88 44 88" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M30 106 Q36 100 42 101" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>